<svg viewBox="0 0 36 48" width="36" height="48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="nfc"><rect width="36" height="48" rx="2"/></clipPath>
  </defs>
  <!-- Shadow -->
