<svg width="100%" viewBox="0 0 680 160" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Gloucestershire Badminton League banner</title>

<style>
  .banner-bg { fill: #1e3390; }
  .stripe-dark { fill: #162878; }
  .stripe-mid { fill: #253daa; }
  .white-text { fill: #ffffff; font-family: 'DM Serif Display', 'Georgia', serif; letter-spacing: 0.02em; }
  .court-line { stroke: rgba(255,255,255,0.08); stroke-width: 1; fill: none; }
  .court-line-mid { stroke: rgba(255,255,255,0.13); stroke-width: 1; fill: none; }
</style>

<defs>
  <clipPath id="bc"><rect width="680" height="160"/></clipPath>
  <clipPath id="fc"><rect x="0" y="0" width="72" height="96" rx="3"/></clipPath>
</defs>

<rect class="banner-bg" width="680" height="160"/>

<g clip-path="url(#bc)">
  <rect class="stripe-dark" x="-20" y="0" width="60" height="160" transform="skewX(-12)"/>
  <rect class="stripe-mid" x="80" y="0" width="20" height="160" transform="skewX(-12)"/>
  <rect class="stripe-dark" x="580" y="0" width="60" height="160" transform="skewX(-12)"/>
  <rect class="stripe-mid" x="520" y="0" width="20" height="160" transform="skewX(-12)"/>
</g>

<line class="court-line" x1="460" y1="0" x2="460" y2="160"/>
<line class="court-line" x1="640" y1="0" x2="640" y2="160"/>
<line class="court-line-mid" x1="550" y1="0" x2="550" y2="160"/>
<line class="court-line" x1="460" y1="80" x2="650" y2="80"/>
<line class="court-line" x1="460" y1="30" x2="650" y2="30"/>
<line class="court-line" x1="460" y1="130" x2="650" y2="130"/>
<line x1="550" y1="0" x2="550" y2="160" stroke="rgba(240,180,41,0.15)" stroke-width="2" fill="none"/>

<line x1="0" y1="14" x2="680" y2="14" stroke="#f0b429" stroke-width="2" fill="none"/>
<line x1="0" y1="146" x2="680" y2="146" stroke="#f0b429" stroke-width="2" fill="none"/>
<rect x="0" y="14" width="6" height="132" fill="#f0b429"/>

<g transform="translate(28, 30)">
  <rect x="3" y="3" width="72" height="96" rx="3" fill="rgba(0,0,0,0.2)"/>
  <g clip-path="url(#fc)">
    <rect x="0" y="0" width="72" height="96" fill="#6ab04c"/>
    <rect x="0" y="37" width="72" height="22" fill="#f5f0d8"/>
    <rect x="27" y="0" width="18" height="96" fill="#f5f0d8"/>
    <rect x="0" y="40" width="72" height="16" fill="#5b9bd5"/>
    <rect x="30" y="0" width="12" height="96" fill="#5b9bd5"/>
  </g>
  <rect x="0" y="0" width="72" height="96" rx="3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
</g>

<text class="white-text" x="118" y="74" font-size="38" dominant-baseline="middle">Gloucestershire</text>
<text class="white-text" x="120" y="114" font-size="22" dominant-baseline="middle" letter-spacing="0.08em" fill="#bac8ff">Badminton League</text>

</svg>
